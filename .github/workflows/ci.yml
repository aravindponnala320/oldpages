name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: oldpages
          POSTGRES_PASSWORD: oldpages
          POSTGRES_USER: oldpages
        options: >-
          --health-cmd "pg_isready -U oldpages -d oldpages"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 6379:6379
    env:
      OLDPAGES_DATABASE_URL: postgresql+asyncpg://oldpages:oldpages@localhost:5432/oldpages
      OLDPAGES_REDIS_URL: redis://localhost:6379/0
      OLDPAGES_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install API dependencies
        run: pip install -e "apps/api[dev]"
      - name: Ruff format
        run: ruff format --check apps/api
      - name: Ruff lint
        run: ruff check apps/api
      - name: Mypy
        working-directory: apps/api
        run: mypy src tests
      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Check OpenAPI artifact
        run: |
          cd apps/api
          python -m oldpages_api.scripts.export_openapi > ../../docs/api/openapi.json
          cd ../..
          git diff --exit-code docs/api/openapi.json
      - name: Pytest
        working-directory: apps/api
        run: pytest
      - name: Dependency vulnerability scan
        run: pip-audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workspace dependencies
        run: npm install
      - name: Prettier check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: npm run e2e
      - name: Build browser apps
        run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

  docker:
    name: Docker Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/api.Dockerfile -t oldpages-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/node.Dockerfile --build-arg APP_DIR=apps/web -t oldpages-web:ci .
      - name: Build admin image
        run: docker build -f infrastructure/docker/node.Dockerfile --build-arg APP_DIR=apps/admin -t oldpages-admin:ci .

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Build API image for scanning
        run: docker build -f infrastructure/docker/api.Dockerfile -t oldpages-api:scan .
      - name: Container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: oldpages-api:scan
          format: sarif
          output: trivy-results.sarif
      - name: Upload container scan
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
